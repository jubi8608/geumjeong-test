<!doctype html>
<html lang="ko">
<head>

<body>
<title>금정수학 진단 결과지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 화면에선 A4 결과지 세 장을 카드로 쌓고, 인쇄하면 한 장씩 A4로 나뉨 */
:root {
  --plate: #ffffff;
  --bg: #e9ebf2; --paper: #ffffff; --ink: #1c2340; --muted: #5d6585; --line: #dfe2ec; --soft: #f4f5f9;
  --accent: #f2b705; --accent-soft: #fdf3cf; --accent-ink: #1c2340;
  --good: #2e8b57; --good-soft: #e3f3ea; --mid: #6b7290; --mid-soft: #eceef4; --low: #c8553d; --low-soft: #fbe7e2;
  --display: "Hahmlet", "Nanum Myeongjo", serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1222; --paper: #1b1f37; --ink: #e8eaf4; --muted: #a3a9c4; --line: #2e3354; --soft: #23284a;
  --accent: #f5c42f; --accent-soft: #3a3418; --accent-ink: #1c2340;
  --good: #5ec98d; --good-soft: #1d3a2c; --mid: #a3a9c4; --mid-soft: #2a2f50; --low: #ff8f78; --low-soft: #45261f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1222; --paper: #1b1f37; --ink: #e8eaf4; --muted: #a3a9c4; --line: #2e3354; --soft: #23284a;
  --accent: #f5c42f; --accent-soft: #3a3418; --accent-ink: #1c2340;
  --good: #5ec98d; --good-soft: #1d3a2c; --mid: #a3a9c4; --mid-soft: #2a2f50; --low: #ff8f78; --low-soft: #45261f; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6 }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 16px }
.toolbar .title { font-family: var(--display); font-size: 20px; font-weight: 700 }
.btn { font: inherit; font-weight: 700; border-radius: 9px; padding: 10px 16px; cursor: pointer; border: 1px solid var(--line); background: var(--paper); color: var(--ink); text-decoration: none; display: inline-block }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.panel { background: var(--paper); border-radius: 12px; padding: 24px 20px; border: 1px solid var(--line) }
.panel h1 { font-family: var(--display); font-size: 26px; margin: 0 0 6px }
.muted { color: var(--muted) }
input[type=password], input[type=search] { width: 100%; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px }
.row { display: flex; gap: 10px; flex-wrap: wrap }
.err { color: var(--low); min-height: 1.4em }
.tablewrap { overflow-x: auto; margin-top: 12px }
table.list { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums }
table.list th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap }
table.list td { padding: 12px 10px; border-bottom: 1px solid var(--line); white-space: nowrap }
table.list tr.click { cursor: pointer }
table.list tr.click:hover td { background: var(--soft) }
.note { font-size: 13px; color: var(--muted); background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; margin-top: 12px }

/* ── 결과지 ── */
.sheet { background: var(--paper); border-radius: 6px; box-shadow: 0 2px 14px rgba(20, 25, 60, .10); padding: 36px 40px; margin-bottom: 20px; position: relative; overflow: hidden }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; border-bottom: 2px solid var(--ink); padding-bottom: 12px; margin-bottom: 22px; flex-wrap: wrap }
.brand { display: flex; align-items: center; gap: 10px }
.brand img { height: 56px; width: auto; display: block; background: var(--plate); border-radius: 6px; padding: 3px 6px; box-sizing: content-box }
.brand .ko { font-family: var(--display); font-weight: 700; font-size: 20px }
.brand .en { font-size: 10px; letter-spacing: .16em; color: var(--muted) }
.sheet-head .doc { text-align: right; font-size: 12px; color: var(--muted); letter-spacing: .04em }
.sheet-head .doc b { display: block; font-family: var(--display); font-size: 17px; color: var(--ink); letter-spacing: 0 }
.who { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-bottom: 22px; font-size: 14px }
.who b { font-family: var(--display); font-size: 26px; margin-right: 6px }
.who span { color: var(--muted) }
.who span em { font-style: normal; color: var(--ink); font-weight: 600; margin-left: 4px }
.hero { display: grid; grid-template-columns: 180px 1fr; gap: 16px; margin-bottom: 22px }
.score-box { background: var(--ink); color: var(--paper); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; justify-content: center }
.score-box .lab { font-size: 12px; letter-spacing: .08em; opacity: .75 }
.score-box .num { font-family: var(--display); font-size: 56px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums }
.score-box .num small { font-size: 18px; opacity: .7; margin-left: 2px }
.score-box .lv { margin-top: 8px; font-weight: 700; color: var(--accent) }
.type-box { background: var(--accent-soft); border-radius: 10px; padding: 18px 20px; min-width: 0 }
.type-box .lab { font-size: 12px; letter-spacing: .08em; color: var(--muted) }
.type-box .name { font-family: var(--display); font-size: 28px; font-weight: 700; margin: 2px 0 4px }
.type-box p { margin: 0 }
.sec { font-family: var(--display); font-size: 17px; font-weight: 700; margin: 0 0 12px; display: flex; align-items: baseline; gap: 10px }
.sec small { font-family: var(--body); font-size: 12px; font-weight: 500; color: var(--muted) }
.profile { display: grid; grid-template-columns: 300px 1fr; gap: 18px; align-items: center; margin-bottom: 22px }
.radar { width: 100%; max-width: 300px; height: auto; display: block }
.dlist { display: grid; gap: 8px }
.drow { display: grid; grid-template-columns: 76px 1fr 34px 64px; gap: 10px; align-items: center; font-size: 14px }
.drow .nm { font-weight: 600 }
.track { height: 10px; background: var(--soft); border-radius: 5px; position: relative; overflow: hidden }
.track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--ink) }
.track.math i { background: var(--accent) }
.drow .sc { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums }
.dcell { font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap }
.delta { font-weight: 700; font-size: 12.5px; font-variant-numeric: tabular-nums }
.delta.up { color: var(--good) } .delta.down { color: var(--low) } .delta.same { color: var(--muted) }
.ptype { background: var(--soft) }
.axis .dot.pdot { background: var(--ink); border-color: var(--ink); border-radius: 3px; width: 16px; height: 16px; transform: translate(-50%, -50%) rotate(45deg) }
.lg { display: inline-block; width: 10px; height: 10px; margin: 0 4px 0 8px; vertical-align: -1px }
.lg.c { background: var(--accent); border: 2px solid var(--ink); border-radius: 50% }
.lg.p { background: var(--ink); transform: rotate(45deg); width: 9px; height: 9px }
.fits { display: grid; gap: 12px; margin-bottom: 18px }
.fit .fit-h { display: flex; gap: 8px; align-items: center; font-size: 14px }
.fit .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px }
.fit .line { position: relative; height: 12px; margin: 6px 0 4px; background: var(--soft); border-radius: 6px }
.fit .dot { position: absolute; top: 50%; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 3px solid var(--ink); transform: translate(-50%, -50%) }
.fit .line { height: 14px; margin: 12px 0 14px }
.fit .dot { top: 100%; z-index: 2 }
.fit .dot.pdot { top: 0; z-index: 1; background: var(--ink); border-color: var(--ink); border-radius: 3px; width: 15px; height: 15px; transform: translate(-50%, -50%) rotate(45deg) }
.fit p, .lk p { margin: 2px 0 0; font-size: 13px; color: var(--muted) }
.links { list-style: none; padding: 0; margin: 0 0 18px; display: grid; gap: 8px }
.lk { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px }
.lk.both { border-left: 4px solid var(--low) } .lk.parent, .lk.child { border-left: 4px solid var(--accent) } .lk.none { border-left: 4px solid var(--good) }
.lk-h { font-weight: 700; font-size: 14px; margin-bottom: 4px }
.lk-bars { display: grid; grid-template-columns: 44px 1fr 30px 64px 32px 1fr 30px 64px; gap: 8px; align-items: center; font-size: 12.5px }
.lk-bars .who-l { color: var(--muted) }
.lk-bars .sc { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums }
.chip.pair { background: var(--accent-soft); color: var(--ink) }
.pvoice { grid-template-columns: 1fr 1fr 1fr }
@media (max-width: 720px) { .lk-bars { grid-template-columns: 44px 1fr 30px 64px } .pvoice { grid-template-columns: 1fr } }
.guide { background: var(--paper); border: 2px solid var(--accent); border-radius: 12px; padding: 22px 22px 24px; margin-bottom: 20px }
.guide-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px }
.guide-h h2 { font-family: var(--display); font-size: 22px; margin: 4px 0 0 }
.guide-tag { display: inline-block; background: var(--ink); color: var(--paper); font-size: 12px; font-weight: 700; border-radius: 4px; padding: 2px 8px }
.guide-note { color: var(--muted); font-size: 13px; margin: 6px 0 16px }
.guide-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.gbox { background: var(--soft); border-radius: 10px; padding: 14px 16px; min-width: 0 }
.gbox.wide { grid-column: 1 / -1 }
.gbox h3 { font-size: 15px; margin: 0 0 6px }
.gbox h3 small { font-weight: 500; color: var(--muted); font-size: 12px; margin-left: 6px }
.gbox ul { margin: 0; padding-left: 1.2em } .gbox li { margin: 4px 0 }
.gbox p { margin: 4px 0 }
.gq { background: var(--accent-soft); border-radius: 6px; padding: 8px 10px; margin-top: 8px !important; font-size: 13.5px }
.gsub { font-weight: 700; margin-top: 10px !important }
@media (max-width: 720px) { .guide-grid { grid-template-columns: 1fr } }
.chip { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 7px; text-align: center; white-space: nowrap }
.chip.high { background: var(--good-soft); color: var(--good) }
.chip.mid { background: var(--mid-soft); color: var(--mid) }
.chip.low { background: var(--low-soft); color: var(--low) }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px }
.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }
.rank li { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: start; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line) }
.rank .n { font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1.3 }
.rank .t { font-weight: 700 }
.rank .d { font-size: 12.5px; color: var(--muted); line-height: 1.5 }
.rank .s { font-weight: 700; font-variant-numeric: tabular-nums }
.rank.good .n, .rank.good .s { color: var(--good) }
.rank.bad .n, .rank.bad .s { color: var(--low) }
.fgroup { margin-bottom: 14px }
.fgroup h4 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .04em }
.frow { display: grid; grid-template-columns: 112px 1fr 34px 64px; gap: 10px; align-items: center; font-size: 14px; padding: 3px 0 }
.bands { position: absolute; inset: 0; pointer-events: none }
.bands b { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--muted); opacity: .35 }
.axes { display: grid; gap: 14px; margin-bottom: 22px }
.axis { min-width: 0 }
.axis .ends { gap: 12px }
.axis .ends { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600 }
.axis .ends span.on { color: var(--ink) }
.axis .ends span.off { color: var(--muted); font-weight: 500 }
.axis .line { position: relative; height: 12px; margin: 6px 0 2px; background: linear-gradient(90deg, var(--soft), var(--soft)); border-radius: 6px }
.axis .line::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line) }
.axis .dot { position: absolute; top: 50%; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); border: 3px solid var(--ink); transform: translate(-50%, -50%) }
.axis .tip { font-size: 12.5px; color: var(--muted) }
.voice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.voice div { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; min-width: 0 }
.voice .q { font-size: 12px; color: var(--muted) }
.voice .a { font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere }
.voice .wide { grid-column: 1 / -1 }
.rx { list-style: none; padding: 0; margin: 0 0 22px; display: grid; gap: 10px }
.rx li { display: grid; grid-template-columns: 130px 1fr; gap: 14px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px }
.rx .h { font-weight: 700 }
.rx .h .chip { margin-top: 4px }
.rx .why { font-size: 12.5px; color: var(--muted); margin-bottom: 2px }
.tips { margin: 0 0 22px; padding: 16px 18px; background: var(--soft); border-radius: 10px }
.tips ul { margin: 6px 0 0; padding-left: 1.2em }
.tips li { margin: 3px 0 }
.memo { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 6px }
.memo .ln { border-bottom: 1px dashed var(--line); height: 30px }
.foot { margin-top: 18px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted) }
.pgno { position: absolute; right: 40px; bottom: 16px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums }

@media (max-width: 720px) {
  .sheet { padding: 24px 18px 36px }
  .hero, .profile, .two, .voice { grid-template-columns: 1fr }
  .radar { margin: 0 auto }
  .rx li { grid-template-columns: 1fr; gap: 6px }
  .frow { grid-template-columns: 96px 1fr 30px 60px; gap: 8px }
  .pgno { right: 18px }
}

@media print {
  :root, :root[data-theme="dark"] {
    --bg: #fff; --paper: #fff; --ink: #1c2340; --muted: #5d6585; --line: #dfe2ec; --soft: #f4f5f9;
    --accent: #f2b705; --accent-soft: #fdf3cf; --good: #2e8b57; --good-soft: #e3f3ea; --mid: #6b7290; --mid-soft: #eceef4; --low: #c8553d; --low-soft: #fbe7e2; color-scheme: light }
  @page { size: A4; margin: 10mm }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; font-size: 13px }
  .wrap { max-width: none; padding: 0 }
  .noprint { display: none !important }
  .sheet { box-shadow: none; border-radius: 0; margin: 0; padding: 6mm 4mm 10mm; break-after: page; min-height: 275mm }
  .sheet:last-child { break-after: auto }
  .hero { grid-template-columns: 170px 1fr } .profile { grid-template-columns: 270px 1fr } .two, .voice { grid-template-columns: 1fr 1fr }
  .rx li { grid-template-columns: 120px 1fr }
  .rx li, .rank li, .fgroup, .axis { break-inside: avoid }
  .pgno { right: 4mm; bottom: 2mm }
  body { font-size: 12px; line-height: 1.5 }
  .sheet { min-height: 268mm; padding: 4mm 4mm 14mm }
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px }
  .fgrid .frow { grid-template-columns: 88px 1fr 24px 52px; gap: 6px }
  .axes { grid-template-columns: 1fr 1fr; gap: 8px 36px }
  .sheet-head { margin-bottom: 14px }
  .who { margin-bottom: 14px }
  .hero, .profile { margin-bottom: 14px }
  .sec { font-size: 15px; margin-bottom: 8px }
  .fgroup { margin-bottom: 6px }
  .fgroup h4 { margin-bottom: 2px; font-size: 11.5px }
  .frow { padding: 1px 0; font-size: 12.5px }
  .track { height: 8px }
  .axes { gap: 8px 36px; margin-bottom: 14px }
  .axis .line { margin: 3px 0 1px }
  .voice { gap: 6px }
  .rx { gap: 6px; margin-bottom: 14px }
  .rx li { padding: 9px 12px }
  .tips { padding: 10px 14px; margin-bottom: 14px }
  .memo .ln { height: 26px }
  .foot { position: absolute; left: 4mm; right: 4mm; bottom: 7mm; margin: 0 }
  .fits { gap: 6px; margin-bottom: 12px }
  .fit .line { margin: 9px 0 11px }
  .fit p { font-size: 11.5px }
  .pvoice { grid-template-columns: 1fr 1fr 1fr }
  .two .type-box { padding: 12px 16px }
  .two .type-box .name { font-size: 22px }
  /* 상담 가이드만 따로 인쇄 */
  body.print-guide .sheet { display: none !important }
  body.print-guide #guide { display: block !important; border: none; padding: 0 }
  body.print-guide #guide .btn, body.print-guide .guide-note { display: none !important }
  .pgno { bottom: 2mm }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<script>
(function () {
  var C = GJ_CONFIG, D = GJ_DATA, P = GJ_PARENT;
  var app = document.getElementById("app"), bar = document.getElementById("toolbar");
  var inFrame = (function () { try { return window.self !== window.top; } catch (e) { return true; } })();
  var PW_KEY = "gj-admin-pw";
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function getPw() { try { return sessionStorage.getItem(PW_KEY) || ""; } catch (e) { return ""; } }
  function setPw(v) { try { if (v) sessionStorage.setItem(PW_KEY, v); else sessionStorage.removeItem(PW_KEY); } catch (e) {} }
  function fmtDate(d) { d = new Date(d); if (isNaN(d)) return ""; return d.getFullYear() + ". " + (d.getMonth() + 1) + ". " + d.getDate() + "."; }
  function brand() {
    return C.LOGO_URL ? '<div class="brand"><img src="' + esc(C.LOGO_URL) + '" alt="' + esc(C.ACADEMY) + '"></div>'
      : '<div class="brand"><div><div class="ko">' + esc(C.ACADEMY) + '</div><div class="en">' + esc(C.ACADEMY_EN) + '</div></div></div>';
  }

  /* ── 샘플 응답 (미리보기용, 가상의 학생) ── */
  var SAMPLE_NOW = { selfEff: 4.6, intrinsic: 4.9, goal: 4.2, focus: 3.6, plan: 2.9, diligence: 4.8, understand: 4.1, review: 3.0, anxiety: 2.6, resilience: 3.9, family: 5.0, phone: 3.1, mathConf: 3.3, mathCalm: 2.7, errorHandle: 2.5, persist: 3.8 };
  var SAMPLE_BEFORE = { selfEff: 4.0, intrinsic: 4.7, goal: 3.8, focus: 3.4, plan: 2.3, diligence: 4.6, understand: 3.9, review: 2.4, anxiety: 2.0, resilience: 3.5, family: 5.0, phone: 3.3, mathConf: 2.6, mathCalm: 1.9, errorHandle: 1.8, persist: 3.2 };
  function sampleRecord(target, daysAgo, id) {
    target = target || SAMPLE_NOW;
    var lk = {};
    D.factors.forEach(function (f) {
      f.items.forEach(function (it, i) {
        var v = Math.round(target[f.key] + (i % 2 ? 0.4 : -0.4));
        v = Math.max(1, Math.min(6, v));
        lk[it.id] = it.r ? 7 - v : v;
      });
    });
    return {
      id: id || "SAMPLE", submittedAt: new Date(Date.now() - (daysAgo || 0) * 864e5).toISOString(),
      info: { name: "예시 학생", level: "중학교", grade: "2학년", school: "예시중학교" },
      answers: { likert: lk, style: daysAgo ? { s1: -1, s2: -1, s3: -1, s4: -1, s5: -2, s6: -1, s7: 1, s8: 1 } : { s1: -1, s2: -2, s3: 1, s4: -1, s5: -2, s6: -1, s7: 2, s8: 1 },
        open: { o1: "일차방정식, 계산 문제", o2: "문장제, 함수 그래프 읽기", o3: "1~2시간", o4: "90점", o5: "문제를 풀 때 실수가 많고, 시험만 보면 긴장해서 아는 것도 틀려요.", o6: "모르는 걸 편하게 물어볼 수 있으면 좋겠어요." } }
    };
  }
  function sampleParent() {
    var t = { worry: 4.6, pressure: 4.4, outcome: 4.3, compare: 3.4, mathBurden: 4.5, autonomy: 2.8 }, lk = {};
    P.factors.forEach(function (f) {

    });
    domains.forEach(function (_, i) { var p = pt(i, R); s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0] + '" y2="' + p[1] + '" stroke="var(--line)" stroke-width="1"/>'; });

    }

    s += '<polygon points="' + poly + '" fill="var(--accent)" fill-opacity=".35" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>';

      s += '<text x="' + p[0] + '" y="' + (p[1] + dy) + '" text-anchor="' + anchor + '" font-size="12.5" font-weight="700" fill="var(--ink)" font-family="IBM Plex Sans KR, sans-serif">' + esc(d.name) + '</text>';
      s += '<text x="' + p[0] + '" y="' + (p[1] + dy + 14) + '" text-anchor="' + anchor + '" font-size="11.5" fill="var(--muted)" font-family="IBM Plex Sans KR, sans-serif">' + d.score + '</text>';

    var groups = D.domains.map(function (d) {
      var fs = r.factors.filter(function (f) { return f.domain === d.key; });
      return '<div class="fgroup"><h4>' + esc(d.name) + '</h4>' + fs.map(function (f) { return '<div class="frow"><span>' + esc(f.name) + '</span>' + track(f.score, d.key === "math") + '<span class="sc" style="text-align:right;font-weight:700;font-variant-numeric:tabular-nums">' + f.score + '</span>' + chip(f.level) + '</div>'; }).join("") + '</div>';
    }).join("");
    var axes = D.axes.map(function (ax) {
      var v = r.axes[ax.key], pos = (v + 4) / 8 * 100, side = v < 0 ? "a" : v > 0 ? "b" : "";
      var tip = side === "a" ? ax.aTip : side === "b" ? ax.bTip : "두 성향이 균형을 이루고 있습니다.";
      return '<div class="axis"><div class="ends"><span class="' + (side === "a" ? "on" : "off") + '">' + esc(ax.a) + '</span><span class="' + (side === "b" ? "on" : "off") + '">' + esc(ax.b) + '</span></div><div class="line"><span class="dot" style="left:calc(12px + (100% - 24px) * ' + (pos / 100) + ')"></span></div><div class="tip">' + esc(tip) + '</div></div>';
    }).join("");
    var voiceItems = D.openItems.map(function (it0) {
      var it = gjOpenItem(it0, info.level);
      var a = open[it.id]; if (!a) return "";
      return '<div class="' + (it.type === "textarea" ? "wide" : "") + '"><div class="q">' + esc(it.q) + '</div><div class="a">' + esc(a) + '</div></div>';
    }).join("");
    var p2 = '<section class="sheet">' + head("요인별 상세 결과") +
      '<h3 class="sec">16개 요인 점수 <small>막대의 세로선: 45점 · 70점</small></h3><div class="fgrid">' + groups + '</div>' +
      '<h3 class="sec" style="margin-top:18px">나의 학습 성향 <small>좋고 나쁨이 아닌 스타일의 차이</small></h3><div class="axes">' + axes + '</div>' +
      '<h3 class="sec">학생이 직접 쓴 이야기</h3><div class="voice">' + (voiceItems || '<div class="muted">작성한 내용이 없습니다.</div>') + '</div>' +
      foot + '<span class="pgno">%PG%</span></section>';

    // 3쪽
    var focus = r.focus.length ? r.focus : r.weak;
    var axTips = ["S", "D"].map(function (k) { var ax = D.axes.filter(function (a) { return a.key === k; })[0], v = r.axes[k]; return v < 0 ? ax.aTip : v > 0 ? ax.bTip : null; }).filter(Boolean);
    var p3 = '<section class="sheet">' + head(esc(C.ACADEMY) + " 맞춤 처방") +
      '<div class="who" style="margin-bottom:16px"><div><b>' + esc(info.name) + '</b></div><span>학습 유형<em>' + esc(r.type.name) + '</em></span><span>종합<em>' + r.overall + '점</em></span></div>' +
      '<h3 class="sec">요인별 지도 방향 <small>60점 미만 요인부터</small></h3><ul class="rx">' +
        focus.map(function (f) { return '<li><div class="h">' + esc(f.name) + '<br>' + chip(f.level) + ' <span class="muted" style="font-weight:500;font-variant-numeric:tabular-nums">' + f.score + '점</span></div><div><div class="why">' + esc(C.ACADEMY) + '에서는 이렇게 지도합니다</div>' + esc(f.rx) + '</div></li>'; }).join("") +
      '</ul>' +
      '<div class="tips"><b>' + esc(r.type.name) + ' 학생, 이렇게 가르치면 잘 따라와요</b><ul>' + r.type.tips.concat(axTips).map(function (t) { return '<li>' + esc(t) + '</li>'; }).join("") + '</ul></div>' +
      '<h3 class="sec">상담 메모</h3><div class="memo">' + '<div class="ln"></div>'.repeat(6) + '</div>' +
      foot + '<span class="pgno">%PG%</span></section>';

    // 4쪽: 재검사 변화 (이전 검사가 있을 때만)
    var p4 = "";
    if (prev) {
      var ch = r.factors.map(function (f, i) { return { f: f, d: f.score - pr.factors[i].score, before: pr.factors[i].score }; });
      var up = ch.filter(function (c) { return c.d > 0; }).sort(function (a, b) { return b.d - a.d; }).slice(0, 3);
      var down = ch.filter(function (c) { return c.d < 0; }).sort(function (a, b) { return a.d - b.d; }).slice(0, 3);
      var od = r.overall - pr.overall;
      var li = function (c, i, cls) { return '<li><span class="n">' + (i + 1) + '</span><div><div class="t">' + esc(c.f.name) + '</div><div class="d">' + c.before + '점 → ' + c.f.score + '점</div></div><span class="s">' + (c.d > 0 ? "+" : "") + c.d + '</span></li>'; };
      p4 = '<section class="sheet">' + head("재검사 변화 리포트") +
        '<div class="who"><div><b>' + esc(info.name) + '</b></div><span>1차 검사<em>' + fmtDate(prev.submittedAt) + '</em></span><span>이번 검사<em>' + date + '</em></span></div>' +
        '<div class="hero"><div class="score-box"><span class="lab">종합 점수 변화</span><span class="num">' + r.overall + '<small>/100</small></span><span class="lv">' + pr.overall + '점에서 ' + (od > 0 ? od + '점 상승' : od < 0 ? (-od) + '점 하락' : '변화 없음') + '</span></div>' +
        '<div class="type-box"><span class="lab">학습 유형</span><div class="name">' + (pr.type.name === r.type.name ? esc(r.type.name) : esc(pr.type.name) + ' → ' + esc(r.type.name)) + '</div><p>' + (pr.type.name === r.type.name ? '공부 방식과 속도 성향이 1차 검사 때와 같습니다.' : esc(r.type.desc)) + '</p></div></div>' +
        '<h3 class="sec">영역별 변화 <small>점선: 1차 검사 · 노란 면: 이번 검사</small></h3>' +
        '<div class="profile">' + radar(r.domains, pr.domains) + '<div class="dlist">' +
          r.domains.map(function (d, i) { return '<div class="drow"><span class="nm">' + esc(d.name) + '</span>' + track(d.score, d.key === "math") + '<span class="sc">' + d.score + '</span><span class="dcell"><span class="muted">' + pr.domains[i].score + '</span> ' + delta(d.score - pr.domains[i].score) + '</span></div>'; }).join("") +
        '</div></div>' +
        '<div class="two"><div><h3 class="sec">가장 많이 좋아진 요인</h3>' + (up.length ? '<ol class="rank good">' + up.map(li).join("") + '</ol>' : '<p class="muted">점수가 오른 요인이 없습니다.</p>') + '</div>' +
        '<div><h3 class="sec">다시 살펴볼 요인</h3>' + (down.length ? '<ol class="rank bad">' + down.map(li).join("") + '</ol>' : '<p class="muted">점수가 떨어진 요인이 없습니다.</p>') + '</div></div>' +
        '<h3 class="sec" style="margin-top:18px">원장님 코멘트</h3><div class="memo">' + '<div class="ln"></div>'.repeat(3) + '</div>' +
        foot + '<span class="pgno">%PG%</span></section>';
    }
    var pp = parent ? pairPage(r, info, parent, head, foot) : "";
    var html = [p1, p2, p3, pp, p4].join(""), total = (html.match(/%PG%/g) || []).length, k = 0;
    app.innerHTML = guideHtml(r, info, open, parent) + html.replace(/%PG%/g, function () { k++; return k + " / " + total; });
    document.title = (info.name || "학생") + " 학습심리 진단 결과 - " + C.ACADEMY;

    bar.innerHTML = '<span class="row">' + (opts.back ? '<button class="btn" id="back">← 목록</button>' : '') + '<span class="title">' + esc(info.name) + ' 결과지</span></span>' +
      '<span class="row"><button class="btn" id="guideBtn">상담 가이드</button>' +
      (inFrame ? '<span class="muted" style="font-size:13px;align-self:center">PDF 저장은 홈페이지 주소에서 작동해요</span>' : '<button class="btn primary" id="pdf">PDF로 저장 · 인쇄</button>') + '</span>';
    var gd = document.getElementById("guide");
    document.getElementById("guideBtn").onclick = function () { gd.hidden = !gd.hidden; if (!gd.hidden) gd.scrollIntoView({ behavior: "smooth", block: "start" }); };
    document.getElementById("guideClose").onclick = function () { gd.hidden = true; window.scrollTo(0, 0); };
    var gp = document.getElementById("guidePdf");
    if (gp) gp.onclick = function () {
      var t = document.title; document.title = (info.name || "학생") + " 상담 가이드 - " + C.ACADEMY;
      document.body.classList.add("print-guide");
      var done = function () { document.body.classList.remove("print-guide"); document.title = t; window.removeEventListener("afterprint", done); };
      window.addEventListener("afterprint", done);
      window.print(); setTimeout(done, 1500);
    };
    var b = document.getElementById("back"); if (b) b.onclick = opts.back;
    var p = document.getElementById("pdf"); if (p) p.onclick = function () { window.print(); };
    window.scrollTo(0, 0);
  }

  /* ── 미리보기 홈 (API 연결 전) ── */
  function previewHome() {
    var local = null; try { local = JSON.parse(localStorage.getItem("gj-last-result")); } catch (e) {}
    bar.innerHTML = '<span class="title">' + esc(C.ACADEMY) + ' 결과지</span>';
    app.innerHTML = '<div class="panel"><h1>미리보기 모드</h1><p class="muted">아직 앱스 스크립트 주소(config.js의 API_URL)가 연결되지 않았어요. 연결하면 이 화면이 비밀번호 로그인과 학생 목록으로 바뀝니다.</p>' +
      '<div class="row" style="margin-top:14px"><button class="btn primary" id="sample">예시 학생 결과지 보기</button>' + (local ? '<button class="btn" id="mine">방금 한 검사 결과 보기</button>' : '') + '<a class="btn" href="./">검사 화면으로</a></div></div>';
    document.getElementById("sample").onclick = function () { renderReport(sampleRecord(), sampleOpts(previewHome)); };
    var m = document.getElementById("mine"); if (m) m.onclick = function () { showLocal(local, previewHome); };
  }

  /* ── 원장님 로그인·목록 ── */
  /* 앱스 스크립트 주소가 여러 개(배포를 여러 번 한 경우)면 최신 코드가 도는 주소를 자동으로 골라 씀 */
  var apiPick = null;
  function call(url, params) {
    var q = Object.keys(params).map(function (k) { return k + "=" + encodeURIComponent(params[k]); }).join("&");
    return fetch(url + (url.indexOf("?") < 0 ? "?" : "&") + q).then(function (r) { return r.json(); });
  }
  function api(params) {
    var urls = (C.API_URLS && C.API_URLS.length) ? C.API_URLS : [C.API_URL];
    if (apiPick || urls.length === 1) return call(apiPick || urls[0], params);
    return Promise.all(urls.map(function (u) {
      return call(u, { action: "list", key: params.key }).then(function (j) { return { u: u, j: j }; }, function () { return { u: u, j: null }; });
    })).then(function (rs) {
      var best = null, bestScore = -1;
      rs.forEach(function (r) {
        if (!r.j || !r.j.ok) return;
        var items = r.j.items || [], sc = 0;
        if (!items.length) sc = 1;
        items.forEach(function (it) { if ("role" in it) sc += 100; if (it.role === "parent") sc += 10; if (it.paired) sc += 1; });
        if (sc > bestScore) { bestScore = sc; best = r; }
      });
      if (!best) return rs[0].j || { ok: false, error: "unreachable" };
      apiPick = best.u;
      return params.action === "list" ? best.j : call(apiPick, params);
    });
  }
  function login(msg) {
    bar.innerHTML = '<span class="title">' + esc(C.ACADEMY) + ' 결과지</span>';
    app.innerHTML = '<div class="panel" style="max-width:420px;margin:40px auto"><h1>원장님 로그인</h1><p class="muted">학생 검사 결과는 원장님만 볼 수 있어요.</p>' +
      '<form id="lf"><label for="pw" class="muted" style="font-size:13px">비밀번호</label><input type="password" id="pw" autocomplete="current-password"><p class="err" id="err">' + esc(msg || "") + '</p><button class="btn primary" style="width:100%">들어가기</button></form>' +
      '<div class="row" style="margin-top:14px"><button class="btn" id="sample" style="flex:1">예시 결과지 보기</button></div></div>';
    document.getElementById("pw").focus();
    document.getElementById("lf").onsubmit = function (e) { e.preventDefault(); setPw(document.getElementById("pw").value); list(); };
    document.getElementById("sample").onclick = function () { renderReport(sampleRecord(), sampleOpts(function () { login(); })); };
  }
  var cache = null;
  function list() {
    var pw = getPw(); if (!pw) return login();
    app.innerHTML = '<div class="panel muted">학생 목록을 불러오는 중…</div>';
    api({ action: "list", key: pw }).then(function (j) {
      if (!j.ok) { setPw(""); return login(j.error === "unauthorized" ? "비밀번호가 맞지 않아요." : "불러오지 못했어요: " + j.error); }
      cache = j.items; drawList("");
    }).catch(function () { app.innerHTML = '<div class="panel"><p class="err">목록을 불러오지 못했어요. 인터넷 연결과 config.js의 API_URL을 확인해 주세요.</p><button class="btn" id="retry">다시 시도</button></div>'; document.getElementById("retry").onclick = list; });
  }
  function drawList(q) {
    bar.innerHTML = '<span class="title">검사 결과 목록 <span class="muted" style="font-family:var(--body);font-size:14px">' + cache.length + '명</span></span><span class="row"><button class="btn" id="reload">새로고침</button><button class="btn" id="out">로그아웃</button></span>';
    document.getElementById("reload").onclick = list;
    document.getElementById("out").onclick = function () { setPw(""); login(); };
    var rows = cache.filter(function (it) { return !q || (it.name + it.school).indexOf(q) >= 0; });
    app.innerHTML = '<div class="panel"><input type="search" id="q" placeholder="이름이나 학교로 찾기" value="' + esc(q) + '"><div class="tablewrap"><table class="list"><thead><tr><th>제출일</th><th>이름</th><th>학교</th><th>학년</th><th>종합</th><th>학습 유형</th></tr></thead><tbody>' +
      (rows.length ? rows.map(function (it) { return '<tr class="click" data-id="' + esc(it.id) + '" tabindex="0"><td>' + fmtDate(it.ts) + '</td><td><b>' + esc(it.name) + '</b>' + (it.role === "parent" ? ' <span class="chip mid">학부모</span>' : '') + (it.round > 1 ? ' <span class="chip high">' + it.round + '회차</span>' : '') + (it.paired && it.role !== "parent" ? ' <span class="chip pair">부모 검사 ✓</span>' : '') + '</td><td>' + esc(it.school) + '</td><td>' + esc(it.grade) + '</td><td>' + esc(it.overall) + '</td><td>' + esc(it.type) + '</td></tr>'; }).join("")
        : '<tr><td colspan="6" class="muted">아직 제출된 검사가 없어요. 학생이 검사를 마치면 여기에 나타나요.</td></tr>') +
      '</tbody></table></div></div>';
    var qi = document.getElementById("q");
    qi.oninput = function () { var v = qi.value; drawList(v); var n = document.getElementById("q"); n.focus(); n.setSelectionRange(v.length, v.length); };
    Array.prototype.forEach.call(document.querySelectorAll("tr.click"), function (tr) {
      tr.onclick = function () { openOne(tr.getAttribute("data-id")); };
      tr.onkeydown = function (e) { if (e.key === "Enter") openOne(tr.getAttribute("data-id")); };
    });
  }
  function openOne(id) {
    app.innerHTML = '<div class="panel muted">결과지를 불러오는 중…</div>';
    api({ action: "get", id: id, key: getPw() }).then(function (j) {
      if (!j.ok) throw new Error(j.error);
      show(j.item, { prev: j.prev || null, pair: j.pair || null, pairPrev: j.pairPrev || null, back: function () { if (cache) drawList(""); else list(); } });
    }).catch(function (e) { app.innerHTML = '<div class="panel"><p class="err">결과지를 불러오지 못했어요. (' + esc(e.message) + ')</p><button class="btn" id="bk">목록으로</button></div>'; document.getElementById("bk").onclick = list; });
  }

  /* ── 시작 ── */
  var hash = location.hash.replace("#", "");
  var qid = (location.search.match(/[?&]id=([^&]+)/) || [])[1];
  if (hash === "demo") renderReport(sampleRecord(), sampleOpts(C.API_URL ? function () { list(); } : previewHome));
  else if (hash === "local") {
    var rec = null; try { rec = JSON.parse(localStorage.getItem("gj-last-result")); } catch (e) {}
    rec ? showLocal(rec, previewHome) : previewHome();
  }
  else if (!C.API_URL) previewHome();
  else if (qid && getPw()) openOne(decodeURIComponent(qid));
  else if (qid) { login(); var f = document.getElementById("lf"); f.onsubmit = function (e) { e.preventDefault(); setPw(document.getElementById("pw").value); openOne(decodeURIComponent(qid)); }; }
  else list();
})();
</script>

</body>
</html>
